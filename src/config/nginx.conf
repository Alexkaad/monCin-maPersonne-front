server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Essaie de servir le fichier demandé, sinon redirige vers index.html pour gérer les routes SPA
        try_files $uri $uri/ /index.html;
    }

    # Pour toute erreur 404, sert index.html (utile aussi pour SPA)
    error_page 404 /index.html;

    # Gestion des erreurs serveur classiques
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Empêche l'accès aux fichiers cachés (optionnel, sécurité)
    location ~ /\. {
        deny all;
    }
}
